name: pcradio-mcp

services:
  pcradio-mcp:
    image: ghcr.io/rootshell-coder/pcradio-mcp:latest
    pull_policy: always
    container_name: pcradio-mcp
    environment:
      PCRADIO_BASE_URL: ${PCRADIO_BASE_URL:-http://pcradio.local}
      PCRADIO_TIMEOUT: ${PCRADIO_TIMEOUT:-5}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
    ports:
      - "8081:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
