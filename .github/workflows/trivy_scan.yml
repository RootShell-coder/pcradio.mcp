name: Trivy Security Scan

on:
  workflow_run:
    workflows:
      - Docker image
    types:
      - completed

concurrency:
  group: trivy-security-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/rootshell-coder/pcradio-mcp:latest
  TRIVY_IMAGE: ghcr.io/rootshell-coder/trivy-cached:latest
  TRIVY_SECURITY: SECURITY

jobs:
  trivy-scan:
    name: Scan published image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "${IMAGE}"

      - name: Scan image and create report
        shell: bash
        run: |
          {
            echo "pcradio-mcp container security report"
            echo
            echo "============================================================"
            echo "Image: ${IMAGE}"
            echo "============================================================"
            docker run --rm "${TRIVY_IMAGE}" \
              image "${IMAGE}" \
              --skip-db-update
          } > "${TRIVY_SECURITY}"

      - name: Commit SECURITY report
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add "${TRIVY_SECURITY}"

          if git diff --cached --quiet -- "${TRIVY_SECURITY}"; then
            echo "SECURITY report is unchanged"
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update Trivy security scan results [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
